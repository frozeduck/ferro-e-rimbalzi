plugins {
    id 'com.android.application'
}

android {
    namespace 'eu.sabotino.ferrorimbalzi'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'eu.sabotino.ferrorimbalzi'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.9.0'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

