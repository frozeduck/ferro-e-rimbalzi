name: Verifica e pubblica il gioco

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v6
      - name: Verifica JavaScript e regole del gioco
        run: |
          node --check dist/app.js
          npm test
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara il gioco statico
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Pubblica il gioco
        id: deployment
        uses: actions/deploy-pages@v4
